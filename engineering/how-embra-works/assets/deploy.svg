<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1170" role="img" aria-labelledby="title desc"><title id="title">Luồng deploy có migration</title><desc id="desc">Diễn tập; duyệt theo quy tắc; kiểm cấu trúc; snapshot; áp migration; kiểm tra bản mới; chuyển yêu cầu và quan sát. SQL đã commit không tự quay lại khi ứng dụng lỗi.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#262623"/></marker></defs><rect width="100%" height="100%" fill="#faf8f3"/><g font-family="DejaVu Sans, sans-serif" fill="#262623"><text x="28" y="44" font-size="25" font-weight="700">DEPLOY CÓ MIGRATION</text><text x="28" y="78" font-size="19" font-weight="400">Luồng rút gọn cho các migration được hỗ trợ.</text><rect x="28" y="116" width="544" height="90" rx="5" fill="#faf8f3" stroke="#262623" stroke-width="1.5"/><text x="44" y="150" font-size="22" font-weight="700">01 / DIỄN TẬP</text><text x="44" y="178" font-size="18" font-weight="400">Chạy trên bản sao; ghi kết quả</text><path d="M300 206 V248" fill="none" stroke="#262623" stroke-width="2"  marker-end="url(#arrow)"/><rect x="28" y="248" width="544" height="90" rx="5" fill="#faf8f3" stroke="#262623" stroke-width="1.5"/><text x="44" y="282" font-size="22" font-weight="700">02 / QUYẾT ĐỊNH</text><text x="44" y="310" font-size="18" font-weight="400">Duyệt theo quy tắc; gắn mã ràng buộc</text><path d="M300 338 V380" fill="none" stroke="#262623" stroke-width="2"  marker-end="url(#arrow)"/><rect x="28" y="380" width="544" height="90" rx="5" fill="#faf8f3" stroke="#262623" stroke-width="1.5"/><text x="44" y="414" font-size="22" font-weight="700">03 / KIỂM LẠI CẤU TRÚC</text><text x="44" y="442" font-size="18" font-weight="400">Cấu trúc đã đổi → diễn tập lại</text><path d="M300 470 V512" fill="none" stroke="#262623" stroke-width="2"  marker-end="url(#arrow)"/><rect x="28" y="512" width="544" height="90" rx="5" fill="#faf8f3" stroke="#262623" stroke-width="1.5"/><text x="44" y="546" font-size="22" font-weight="700">04 / SNAPSHOT</text><text x="44" y="574" font-size="18" font-weight="400">Chuẩn bị mốc trước khi áp migration</text><path d="M300 602 V644" fill="none" stroke="#262623" stroke-width="2"  marker-end="url(#arrow)"/><rect x="28" y="644" width="544" height="90" rx="5" fill="#d3f28c" stroke="#262623" stroke-width="1.5"/><text x="44" y="678" font-size="22" font-weight="700">05 / ÁP MIGRATION</text><text x="44" y="706" font-size="18" font-weight="400">Đọc bản ghi để xác định kết quả</text><path d="M300 734 V776" fill="none" stroke="#262623" stroke-width="2"  marker-end="url(#arrow)"/><rect x="28" y="776" width="544" height="90" rx="5" fill="#faf8f3" stroke="#262623" stroke-width="1.5"/><text x="44" y="810" font-size="22" font-weight="700">06 / CHẠY BẢN MỚI</text><text x="44" y="838" font-size="18" font-weight="400">Kiểm khả năng phục vụ và cấu hình</text><path d="M300 866 V908" fill="none" stroke="#262623" stroke-width="2"  marker-end="url(#arrow)"/><rect x="28" y="908" width="544" height="90" rx="5" fill="#faf8f3" stroke="#262623" stroke-width="1.5"/><text x="44" y="942" font-size="22" font-weight="700">07 / CHUYỂN YÊU CẦU</text><text x="44" y="970" font-size="18" font-weight="400">Quan sát; giữ hoặc chuyển về bản cũ</text><text x="28" y="1072" font-size="21" font-weight="700">Sau commit: cơ sở dữ liệu đã có cấu trúc mới.</text><text x="28" y="1110" font-size="21" font-weight="400">Chạy lại mã cũ không hoàn tác SQL.</text></g></svg>