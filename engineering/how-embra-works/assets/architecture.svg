<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1080" role="img" aria-labelledby="title desc"><title id="title">Hai đường đi trong Embra</title><desc id="desc">Yêu cầu qua cổng định tuyến tới ứng dụng và Postgres. CLI gửi lệnh điều khiển; chương trình quản lý máy chủ tạo tài nguyên. Dữ liệu điều khiển lưu riêng. Bản sao diễn tập cùng máy chủ.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#262623"/></marker></defs><rect width="100%" height="100%" fill="#faf8f3"/><g font-family="DejaVu Sans, sans-serif" fill="#262623"><text x="28" y="45" font-size="24" font-weight="700">EMBRA / NỀN TẢNG M1</text><text x="28" y="81" font-size="19" font-weight="400">Các thành phần cùng máy chủ; chưa có dự phòng.</text><text x="28" y="133" font-size="19" font-weight="700">PHỤC VỤ ỨNG DỤNG</text><text x="358" y="133" font-size="19" font-weight="700">ĐIỀU KHIỂN DEPLOY</text><rect x="28" y="158" width="270" height="78" rx="5" fill="#faf8f3" stroke="#262623" stroke-width="1.5"/><text x="44" y="192" font-size="22" font-weight="700">Yêu cầu</text><text x="44" y="220" font-size="18" font-weight="400">Từ người dùng</text><rect x="358" y="158" width="294" height="78" rx="5" fill="#faf8f3" stroke="#262623" stroke-width="1.5"/><text x="374" y="192" font-size="22" font-weight="700">CLI</text><text x="374" y="220" font-size="18" font-weight="400">Image + cấu hình</text><rect x="28" y="296" width="270" height="82" rx="5" fill="#faf8f3" stroke="#262623" stroke-width="1.5"/><text x="44" y="330" font-size="22" font-weight="700">Cổng định tuyến</text><text x="44" y="358" font-size="18" font-weight="400">Caddy + bảng định tuyến</text><rect x="358" y="296" width="294" height="82" rx="5" fill="#faf8f3" stroke="#262623" stroke-width="1.5"/><text x="374" y="330" font-size="22" font-weight="700">embrad</text><text x="374" y="358" font-size="18" font-weight="400">API + xử lý tác vụ</text><path d="M163 236 V296" fill="none" stroke="#262623" stroke-width="2"  marker-end="url(#arrow)"/><path d="M505 236 V296" fill="none" stroke="#262623" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M358 337 H298" fill="none" stroke="#262623" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="358" y="438" width="294" height="82" rx="5" fill="#faf8f3" stroke="#262623" stroke-width="1.5"/><text x="374" y="472" font-size="22" font-weight="700">Dữ liệu điều khiển</text><text x="374" y="500" font-size="18" font-weight="400">Thao tác, bản phát hành</text><path d="M505 378 V438" fill="none" stroke="#262623" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="28" y="578" width="270" height="82" rx="5" fill="#faf8f3" stroke="#262623" stroke-width="1.5"/><text x="44" y="612" font-size="22" font-weight="700">App</text><text x="44" y="640" font-size="18" font-weight="400">Container / gVisor</text><path d="M163 378 V578" fill="none" stroke="#262623" stroke-width="2"  marker-end="url(#arrow)"/><rect x="358" y="578" width="294" height="82" rx="5" fill="#faf8f3" stroke="#262623" stroke-width="1.5"/><text x="374" y="612" font-size="22" font-weight="700">Quản lý máy chủ</text><text x="374" y="640" font-size="18" font-weight="400">Container, mạng, lưu trữ</text><path d="M652 337 H668 V550 H505 V578" fill="none" stroke="#262623" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M358 618 H298" fill="none" stroke="#262623" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="28" y="730" width="270" height="82" rx="5" fill="#faf8f3" stroke="#262623" stroke-width="1.5"/><text x="44" y="764" font-size="22" font-weight="700">PostgreSQL của app</text><text x="44" y="792" font-size="18" font-weight="400">Container / lưu trữ ZFS</text><path d="M163 660 V730" fill="none" stroke="#262623" stroke-width="2"  marker-end="url(#arrow)"/><path d="M505 660 V771 H298" fill="none" stroke="#262623" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="28" y="892" width="624" height="88" rx="5" fill="#f0e7d5" stroke="#262623" stroke-width="1.5"/><text x="44" y="926" font-size="22" font-weight="700">Bản sao diễn tập</text><text x="44" y="954" font-size="18" font-weight="400">Tạo từ snapshot ZFS của Postgres, cùng máy chủ</text><path d="M163 812 V892" fill="none" stroke="#262623" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="28" y="1020" font-size="18" font-weight="400">Liền: yêu cầu / dữ liệu. Đứt: điều khiển / tạo tài nguyên.</text><text x="28" y="1051" font-size="18" font-weight="400">Đã lược bỏ sao lưu và kết nối của trình thực thi.</text></g></svg>