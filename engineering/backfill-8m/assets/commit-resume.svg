<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 475" role="img"><rect width="1100" height="475" rx="12" fill="#faf8f3"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#59645c"/></marker></defs><g font-family="Arial, sans-serif" fill="#232323"><text x="40" y="48" font-size="28" fill="#232323" font-weight="bold">M4 · Hai điểm ngắt, hai mốc tiến độ</text><text x="40" y="100" font-size="22" fill="#232323" font-weight="bold">Ngắt trước commit lô 7</text><rect x="40" y="122" width="260" height="64" rx="8" fill="#fff" stroke="#d1cabd"/><text x="60" y="161" font-size="20" fill="#232323" font-weight="normal">Dữ liệu + bản ghi</text><path d="M302 154L384 154" fill="none" stroke="#59645c" stroke-width="2" marker-end="url(#arrow)"/><rect x="386" y="122" width="270" height="64" rx="8" fill="#fff" stroke="#d1cabd"/><text x="408" y="161" font-size="20" fill="#b45820" font-weight="normal">CHƯA COMMIT</text><path d="M658 154L741 154" fill="none" stroke="#59645c" stroke-width="2" marker-end="url(#arrow)"/><rect x="743" y="122" width="310" height="64" rx="8" fill="#fff" stroke="#d1cabd"/><text x="765" y="161" font-size="22" fill="#232323" font-weight="bold">last_id = 30.000</text><text x="40" y="275" font-size="22" fill="#232323" font-weight="bold">Ngắt sau commit lô 13, trước ACK</text><rect x="40" y="297" width="260" height="64" rx="8" fill="#fff" stroke="#d1cabd"/><text x="60" y="336" font-size="20" fill="#232323" font-weight="normal">Dữ liệu + bản ghi</text><path d="M302 329L384 329" fill="none" stroke="#59645c" stroke-width="2" marker-end="url(#arrow)"/><rect x="386" y="297" width="270" height="64" rx="8" fill="#fff" stroke="#d1cabd"/><text x="408" y="336" font-size="20" fill="#b45820" font-weight="normal">ĐÃ COMMIT</text><path d="M658 329L741 329" fill="none" stroke="#59645c" stroke-width="2" marker-end="url(#arrow)"/><rect x="743" y="297" width="310" height="64" rx="8" fill="#fff" stroke="#d1cabd"/><text x="765" y="336" font-size="22" fill="#232323" font-weight="bold">last_id = 65.000</text><text x="40" y="226" font-size="18" fill="#656962" font-weight="normal">Chưa commit → đọc bản ghi cũ, xử lý lại lô chưa hoàn tất.</text><text x="40" y="402" font-size="18" fill="#656962" font-weight="normal">Mất ACK → đọc bản ghi đã commit, tiếp tục từ mốc tiến độ mới.</text><text x="40" y="449" font-size="16" fill="#656962" font-weight="normal">Sơ đồ cơ chế; không theo tỷ lệ thời gian. Nguồn: M4-executor.jsonl, lượt 28/9.</text></g></svg>
