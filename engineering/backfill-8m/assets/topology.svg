-size="19" fill="#232323" font-weight="normal">Seed: 8 triệu dòng / 10,35 GiB · ext4 trên zvol · dữ liệu tổng hợp</text><text x="40" y="400" font-size="16" fill="#656962" font-weight="normal">Sơ đồ topology; không thể hiện mọi thành phần backup/approval của lab.</text></g></svg>